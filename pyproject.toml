[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitti-visual-slam"
version = "0.1.0"
description = "Course-built stereo visual SLAM with custom RANSAC, tracking, and windowed optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "tqdm"]

[project.optional-dependencies]
plotting = ["matplotlib"]
optimization = ["gtsam"]

[project.scripts]
kitti-slam = "kitti_slam.pipeline:main"

[tool.setuptools]
py-modules = ["tracking_database"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kitti_slam*"]
